server:
  port: 8082

spring:
  application:
    name: bakery-shop
  datasource:
    url: jdbc:mysql://localhost:3306/bakery_shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:Z200612qwe}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 4

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: / # 默认虚拟主机
    publisher-confirm-type: correlated # 确认模式
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto # 自动ack消息确认
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
        default-requeue-rejected: false

  # Spring AI (DeepSeek 兼容 OpenAI 协议)
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat


# JWT
jwt:
  secret: ${JWT_SECRET:Y2FrZS1wbGF0Zm9ybS1qd3Qtc2VjcmV0LWtleS0yMDI2}
  expiration: 86400000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Aliyun OSS
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    bucket-name: ${ALIYUN_OSS_BUCKET:your-bucket-name}
